version: '3.9'

services:
  # Angular frontend served via Nginx
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: employee-portal-frontend
    ports:
      - '${APP_PORT:-4200}:80'
    environment:
      - NODE_ENV=production
    networks:
      - portal-network
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:80/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Placeholder backend API (replace with your actual backend service)
  backend:
    image: node:20-alpine
    container_name: employee-portal-backend
    working_dir: /app
    volumes:
      - ./mock-backend:/app
    command: sh -c "npm install && node server.js"
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=development
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-employee_portal}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
    networks:
      - portal-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: employee-portal-db
    environment:
      - POSTGRES_DB=${DB_NAME:-employee_portal}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    networks:
      - portal-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-employee_portal}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Development-only: Angular dev server with hot reload
  frontend-dev:
    image: node:20-alpine
    container_name: employee-portal-dev
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm ci && npm start -- --host 0.0.0.0 --port 4200"
    ports:
      - '4200:4200'
    environment:
      - NODE_ENV=development
    networks:
      - portal-network
    profiles:
      - dev
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  portal-network:
    driver: bridge
