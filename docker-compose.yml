version: '3.9'

# ── Employee Portal — Local Development Stack ──────────────
# Services:
#   frontend  — Angular dev server (with HMR)
#   backend   — Placeholder REST API (replace with your backend)

services:

  # ── Angular dev server ────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: employee_portal_frontend
    ports:
      - '4200:4200'
    volumes:
      # Mount source for live-reload; exclude node_modules
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true # Required for file-watching in Docker on some OSes
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - portal_net

  # ── Backend API placeholder ───────────────────────────────
  # Replace this with your real backend service / image
  backend:
    image: node:20-alpine
    container_name: employee_portal_backend
    working_dir: /api
    command: sh -c "npm install -g json-server && json-server --watch db.json --port 3000 --host 0.0.0.0"
    ports:
      - '3000:3000'
    volumes:
      - ./mock-api:/api
    restart: unless-stopped
    networks:
      - portal_net

  # ── Production build preview ──────────────────────────────
  # Run:  docker-compose up frontend-prod
  frontend-prod:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: employee_portal_prod
    ports:
      - '8080:80'
    restart: unless-stopped
    networks:
      - portal_net
    profiles:
      - prod

networks:
  portal_net:
    driver: bridge
