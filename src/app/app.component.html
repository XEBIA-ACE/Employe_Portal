<!-- Full-page auth layout (login) — no shell -->
<ng-container *ngIf="isAuthRoute">
  <router-outlet></router-outlet>
</ng-container>

<!-- Authenticated app shell -->
<ng-container *ngIf="!isAuthRoute && isAuthenticated">
  <!-- Top Header Bar -->
  <app-header (sidebarToggle)="toggleSidebar()"></app-header>

  <!-- Sidebar Navigation -->
  <app-sidebar [collapsed]="sidebarCollapsed"></app-sidebar>

  <!-- Main Content Area -->
  <main
    class="main-content"
    [class.sidebar-collapsed]="sidebarCollapsed"
    role="main"
  >
    <router-outlet></router-outlet>
  </main>

  <!-- Global Toast Notifications -->
  <app-notification></app-notification>
</ng-container>

<!-- Fallback for unauthenticated non-auth routes (guard will redirect) -->
<ng-container *ngIf="!isAuthRoute && !isAuthenticated">
  <router-outlet></router-outlet>
</ng-container>
