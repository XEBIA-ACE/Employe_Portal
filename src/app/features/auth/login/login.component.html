<div class="login-page">
  <div class="login-card">
    <!-- Logo / Branding -->
    <div class="login-card__brand">
      <div class="brand-icon">EP</div>
      <h1 class="brand-title">Employee Portal</h1>
      <p class="brand-subtitle">Sign in to your account</p>
    </div>

    <!-- Login Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
      <!-- Email -->
      <div class="form-group">
        <label for="email">Email address</label>
        <input
          id="email"
          type="email"
          class="form-control"
          formControlName="email"
          placeholder="you@company.com"
          autocomplete="email"
          [class.ng-invalid]="emailControl.invalid && emailControl.touched"
        />
        <span class="form-error" *ngIf="emailControl.touched && emailControl.errors?.['required']">
          Email is required.
        </span>
        <span class="form-error" *ngIf="emailControl.touched && emailControl.errors?.['email']">
          Please enter a valid email address.
        </span>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-wrapper">
          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            class="form-control"
            formControlName="password"
            placeholder="••••••••"
            autocomplete="current-password"
            [class.ng-invalid]="passwordControl.invalid && passwordControl.touched"
          />
          <button
            type="button"
            class="toggle-password"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
          >
            {{ showPassword ? '🙈' : '👁️' }}
          </button>
        </div>
        <span class="form-error" *ngIf="passwordControl.touched && passwordControl.errors?.['required']">
          Password is required.
        </span>
        <span class="form-error" *ngIf="passwordControl.touched && passwordControl.errors?.['minlength']">
          Password must be at least 6 characters.
        </span>
      </div>

      <!-- Remember Me -->
      <div class="form-group form-group--checkbox">
        <label class="checkbox-label">
          <input type="checkbox" formControlName="rememberMe" />
          <span>Remember me for 30 days</span>
        </label>
        <a href="#" class="forgot-link">Forgot password?</a>
      </div>

      <!-- Submit -->
      <button
        type="submit"
        class="btn btn--primary w-full"
        [disabled]="isLoading"
      >
        <span *ngIf="isLoading" class="spinner"></span>
        {{ isLoading ? 'Signing in...' : 'Sign in' }}
      </button>
    </form>

    <!-- Footer -->
    <p class="login-card__footer">
      Need access? Contact your <strong>HR Administrator</strong>.
    </p>
  </div>
</div>
