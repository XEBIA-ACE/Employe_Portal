<div class="login-page">
  <div class="login-card-wrapper">
    <mat-card class="login-card">
      <mat-card-header>
        <div class="login-logo">
          <mat-icon>business</mat-icon>
        </div>
        <mat-card-title>Employee Portal</mat-card-title>
        <mat-card-subtitle>Sign in to your account</mat-card-subtitle>
      </mat-card-header>

      <mat-card-content>
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>

          <!-- Email -->
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Email address</mat-label>
            <input
              matInput
              type="email"
              formControlName="email"
              placeholder="you@company.com"
              autocomplete="email"
            />
            <mat-icon matSuffix>email</mat-icon>
            <mat-error *ngIf="emailControl.hasError('required')">Email is required</mat-error>
            <mat-error *ngIf="emailControl.hasError('email')">Please enter a valid email</mat-error>
          </mat-form-field>

          <!-- Password -->
          <mat-form-field appearance="outline" class="full-width mt-1">
            <mat-label>Password</mat-label>
            <input
              matInput
              [type]="hidePassword ? 'password' : 'text'"
              formControlName="password"
              autocomplete="current-password"
            />
            <button
              mat-icon-button
              matSuffix
              type="button"
              (click)="hidePassword = !hidePassword"
              [attr.aria-label]="hidePassword ? 'Show password' : 'Hide password'"
            >
              <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
            <mat-error *ngIf="passwordControl.hasError('required')">Password is required</mat-error>
            <mat-error *ngIf="passwordControl.hasError('minlength')">
              Password must be at least 6 characters
            </mat-error>
          </mat-form-field>

          <!-- Remember me + Forgot password -->
          <div class="login-options">
            <mat-checkbox formControlName="rememberMe" color="primary">Remember me</mat-checkbox>
            <a routerLink="/auth/forgot-password" class="forgot-link">Forgot password?</a>
          </div>

          <!-- Submit -->
          <button
            mat-raised-button
            color="primary"
            type="submit"
            class="full-width login-button mt-2"
            [disabled]="isLoading"
          >
            <mat-spinner *ngIf="isLoading" diameter="20" class="button-spinner"></mat-spinner>
            <span *ngIf="!isLoading">Sign In</span>
          </button>
        </form>

        <!-- Demo credentials (development only) -->
        <mat-divider class="mt-3 mb-2"></mat-divider>
        <p class="demo-label">Quick access (demo)</p>
        <div class="demo-buttons">
          <button mat-stroked-button (click)="fillDemoCredentials('admin')" type="button">
            Admin
          </button>
          <button mat-stroked-button (click)="fillDemoCredentials('hr')" type="button">
            HR Manager
          </button>
          <button mat-stroked-button (click)="fillDemoCredentials('employee')" type="button">
            Employee
          </button>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</div>
