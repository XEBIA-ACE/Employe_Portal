<div class="login-page">
  <div class="login-card-wrapper" style="max-width: 400px; margin: auto;">
    <mat-card>
      <mat-card-header>
        <mat-card-title>Reset Password</mat-card-title>
        <mat-card-subtitle>Enter your email to receive a reset link</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content class="p-2">
        <div *ngIf="!emailSent">
          <form [formGroup]="form" (ngSubmit)="onSubmit()">
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Email address</mat-label>
              <input matInput type="email" formControlName="email" />
              <mat-error *ngIf="form.get('email')?.hasError('required')">Email is required</mat-error>
              <mat-error *ngIf="form.get('email')?.hasError('email')">Invalid email address</mat-error>
            </mat-form-field>
            <button mat-raised-button color="primary" type="submit" class="full-width mt-2" [disabled]="isLoading">
              {{ isLoading ? 'Sending...' : 'Send Reset Link' }}
            </button>
          </form>
        </div>
        <div *ngIf="emailSent" class="text-center p-2">
          <mat-icon style="font-size: 48px; width: 48px; height: 48px; color: #43a047;">check_circle</mat-icon>
          <p>Check your email for the password reset link.</p>
        </div>
        <div class="text-center mt-2">
          <a mat-button routerLink="/auth/login">Back to Login</a>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</div>
