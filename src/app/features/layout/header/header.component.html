<mat-toolbar class="app-header" color="primary">
  <!-- Mobile menu toggle -->
  <button mat-icon-button (click)="menuToggled.emit()" aria-label="Toggle navigation menu">
    <mat-icon>menu</mat-icon>
  </button>

  <!-- App title -->
  <span class="header-title">Employee Portal</span>

  <span class="flex-spacer"></span>

  <!-- Notification bell (placeholder) -->
  <button mat-icon-button aria-label="Notifications" matTooltip="Notifications">
    <mat-icon [matBadge]="3" matBadgeColor="warn" matBadgeSize="small">notifications</mat-icon>
  </button>

  <!-- User avatar + menu -->
  <button mat-icon-button [matMenuTriggerFor]="userMenu" aria-label="User menu">
    <div class="header-avatar">{{ userInitials }}</div>
  </button>

  <mat-menu #userMenu="matMenu">
    <div class="user-menu-header" mat-menu-item disabled>
      <strong>{{ currentUser?.firstName }} {{ currentUser?.lastName }}</strong>
      <br>
      <small>{{ currentUser?.email }}</small>
    </div>
    <mat-divider></mat-divider>
    <button mat-menu-item routerLink="/profile">
      <mat-icon>person</mat-icon>
      <span>My Profile</span>
    </button>
    <mat-divider></mat-divider>
    <button mat-menu-item (click)="logout()">
      <mat-icon>logout</mat-icon>
      <span>Log Out</span>
    </button>
  </mat-menu>
</mat-toolbar>
