<mat-toolbar class="app-toolbar" color="primary">
  <!-- Sidenav toggle -->
  <button
    mat-icon-button
    (click)="onToggleSidenav()"
    matTooltip="Toggle menu"
    aria-label="Toggle side navigation"
  >
    <mat-icon>menu</mat-icon>
  </button>

  <!-- App brand -->
  <a routerLink="/dashboard" class="brand-link" aria-label="Go to dashboard">
    <mat-icon class="brand-icon">business</mat-icon>
    <span class="brand-name">Employee Portal</span>
  </a>

  <span class="toolbar-spacer"></span>

  <!-- Notifications (placeholder) -->
  <button
    mat-icon-button
    matTooltip="Notifications"
    aria-label="View notifications"
  >
    <mat-icon [matBadge]="3" matBadgeColor="warn" matBadgeSize="small">
      notifications
    </mat-icon>
  </button>

  <!-- User menu -->
  <button
    mat-icon-button
    [matMenuTriggerFor]="userMenu"
    class="user-avatar-btn"
    aria-label="Open user menu"
  >
    @if (authService.currentUser()?.avatarUrl) {
      <img
        [src]="authService.currentUser()!.avatarUrl"
        [alt]="authService.currentUser()!.firstName"
        class="user-avatar"
      />
    } @else {
      <mat-icon>account_circle</mat-icon>
    }
  </button>

  <mat-menu #userMenu="matMenu" xPosition="before">
    <!-- User info header -->
    <div class="menu-user-info" (click)="$event.stopPropagation()">
      <p class="user-name">
        {{ authService.currentUser()?.firstName }} {{ authService.currentUser()?.lastName }}
      </p>
      <p class="user-email">{{ authService.currentUser()?.email }}</p>
      <span class="role-chip">{{ authService.userRole() }}</span>
    </div>
    <mat-divider></mat-divider>
    <button mat-menu-item (click)="onViewProfile()">
      <mat-icon>person</mat-icon>
      <span>My Profile</span>
    </button>
    <button mat-menu-item routerLink="/profile/settings">
      <mat-icon>settings</mat-icon>
      <span>Settings</span>
    </button>
    <mat-divider></mat-divider>
    <button mat-menu-item (click)="onLogout()" class="logout-btn">
      <mat-icon>logout</mat-icon>
      <span>Sign Out</span>
    </button>
  </mat-menu>
</mat-toolbar>
