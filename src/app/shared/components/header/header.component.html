<header class="app-header" role="banner">
  <!-- Hamburger / Sidebar Toggle -->
  <button
    class="header-btn"
    (click)="toggleSidebar()"
    aria-label="Toggle sidebar navigation"
  >
    ☰
  </button>

  <!-- App Brand (visible on mobile) -->
  <a routerLink="/dashboard" class="header-brand">
    <span class="header-brand__icon">EP</span>
    <span class="header-brand__text">Employee Portal</span>
  </a>

  <div class="header-spacer"></div>

  <!-- Notifications placeholder -->
  <button class="header-btn" aria-label="Notifications">
    🔔
  </button>

  <!-- User Menu -->
  <div class="user-menu" (clickOutside)="closeUserMenu()">
    <button
      class="user-menu__trigger"
      (click)="toggleUserMenu()"
      [attr.aria-expanded]="showUserMenu"
      aria-haspopup="true"
    >
      <div class="avatar avatar--sm">{{ userInitials }}</div>
      <span class="user-menu__name">
        {{ currentUser?.firstName }} {{ currentUser?.lastName }}
      </span>
      <span class="user-menu__chevron" [class.rotated]="showUserMenu">▾</span>
    </button>

    <div class="user-menu__dropdown" *ngIf="showUserMenu" role="menu">
      <a
        routerLink="/profile"
        class="user-menu__item"
        role="menuitem"
        (click)="closeUserMenu()"
      >
        👤 My Profile
      </a>
      <div class="user-menu__divider"></div>
      <button class="user-menu__item user-menu__item--danger" role="menuitem" (click)="logout()">
        🚪 Sign Out
      </button>
    </div>
  </div>
</header>
