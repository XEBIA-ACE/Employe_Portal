<nav class="sidebar" [class.collapsed]="collapsed" role="navigation" aria-label="Main navigation">
  <!-- Brand -->
  <div class="sidebar__brand">
    <div class="brand-mark">EP</div>
    <span class="brand-label" *ngIf="!collapsed">Employee Portal</span>
  </div>

  <!-- Navigation Items -->
  <ul class="sidebar__nav" role="list">
    <li *ngFor="let item of navItems">
      <a
        *ngIf="isVisible(item)"
        [routerLink]="item.route"
        class="nav-item"
        [class.active]="isActive(item.route)"
        [attr.title]="collapsed ? item.label : null"
        role="listitem"
      >
        <span class="nav-item__icon" aria-hidden="true">{{ item.icon }}</span>
        <span class="nav-item__label" *ngIf="!collapsed">{{ item.label }}</span>
        <span class="nav-item__badge" *ngIf="item.badge && !collapsed">{{ item.badge }}</span>
      </a>
    </li>
  </ul>

  <!-- Bottom Actions -->
  <div class="sidebar__footer">
    <button class="nav-item nav-item--logout" (click)="logout()" title="Sign out">
      <span class="nav-item__icon">🚪</span>
      <span class="nav-item__label" *ngIf="!collapsed">Sign Out</span>
    </button>
  </div>
</nav>
