# Nginx configuration for serving the Angular SPA in production.
# Used by the multi-stage Dockerfile.

# ─── Worker Processes ──────────────────────────────────────────────────────
worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # ─── Logging ───────────────────────────────────────────────────────────────
  log_format main '$remote_addr - $remote_user [$time_local] '
                  '"$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent"';
  access_log /var/log/nginx/access.log main;

  # ─── Performance ───────────────────────────────────────────────────────────
  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout 65;
  gzip            on;
  gzip_vary       on;
  gzip_proxied    any;
  gzip_comp_level 6;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ─── Security Headers ───────────────────────────────────────────────────
    add_header X-Frame-Options          "SAMEORIGIN"               always;
    add_header X-Content-Type-Options   "nosniff"                  always;
    add_header X-XSS-Protection         "1; mode=block"            always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "camera=(), microphone=()" always;

    # ─── API Reverse Proxy ──────────────────────────────────────────────────
    # Uncomment and set BACKEND_URL to proxy API requests to your backend.
    # location /api/ {
    #   proxy_pass         http://backend:3000;
    #   proxy_http_version 1.1;
    #   proxy_set_header   Upgrade $http_upgrade;
    #   proxy_set_header   Connection 'upgrade';
    #   proxy_set_header   Host $host;
    #   proxy_cache_bypass $http_upgrade;
    # }

    # ─── Static Assets (aggressively cached) ────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      access_log off;
    }

    # ─── SPA Fallback ───────────────────────────────────────────────────────
    # All unknown routes are served the index.html so Angular Router takes over.
    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ─── Health Check ───────────────────────────────────────────────────────
    location /health {
      return 200 '{"status":"ok"}';
      add_header Content-Type application/json;
      access_log off;
    }
  }
}
